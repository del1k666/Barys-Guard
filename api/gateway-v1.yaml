      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/SessionSummary'
                type: array
                title: Response List Sessions Api V1 Auth Sessions Get
  /api/v1/auth/sessions/{session_id}:
    delete:
      tags:
      - auth
      summary: Revoke Own Session

components:
  schemas:
    AgentConfigDocument:
      properties:
        transport:
          $ref: '#/components/schemas/TransportConfig'
          default:
            heartbeat_interval_seconds: 30
            event_batch_max: 500
            event_batch_max_bytes: 4194304
            backoff_base_seconds: 1
            backoff_max_seconds: 300
        buffer:
          $ref: '#/components/schemas/BufferConfig'
          default:
            max_bytes: 524288000
            max_age_days: 7
        logging:
          $ref: '#/components/schemas/LoggingConfig'
          default:
            level: info
        collectors:
          $ref: '#/components/schemas/CollectorsConfig'
          default:
            usb:
              enabled: true
              poll_seconds: 2
            file_watch:
              enabled: true
              exclude:
              - '*\~$*'
              - '*.tmp'
              - '*.crdownload'
              - '*\AppData\*'
              max_events_per_second: 200
              max_hash_bytes: 268435456
              max_wait_ms: 30000
              paths:
              - '%USERS%\Documents'
              - '%USERS%\Desktop'
              - '%USERS%\Downloads'
              stable_ms: 1500
            artifact:
              enabled: true
              max_bytes: 52428800
              stage_bytes_per_minute: 209715200
              staging_max_bytes: 524288000
              upload_bytes_per_second: 2097152
        policies:
          additionalProperties: true
          type: object
          title: Policies
      additionalProperties: false
      type: object
      title: AgentConfigDocument
      description: 'Полная форма конфигурации агента.


        extra="forbid" на каждом уровне обязателен: опечатка вроде

        heartbeat_intervall иначе молча не применится, и разбор такого

        инцидента занимает часы.'
    AgentConfigResponse:
      properties:
        version:
          type: integer
          title: Version
        document:
          additionalProperties: true
          type: object
          title: Document
      type: object
      required:
      - version
      - document
      title: AgentConfigResponse
    AgentDetail:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        hostname:
          type: string
          title: Hostname
        os:
          type: string
          title: Os
        os_version:
          type: string
          title: Os Version
        arch:
          type: string
          title: Arch
        agent_version:
          type: string
          title: Agent Version
        status:
          type: string
          title: Status
        group_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Group Id
        group_name:
          anyOf:
          - type: string
          - type: 'null'
          title: Group Name
        last_heartbeat_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Heartbeat At
        last_ip:
          anyOf:
          - type: string
          - type: 'null'
          title: Last Ip
        clock_skew_ms:
          type: integer
          title: Clock Skew Ms
        config_version:
          type: integer
          title: Config Version
        enrolled_at:
          type: string
          format: date-time
          title: Enrolled At
        machine_id:
          type: string
          title: Machine Id
        tags:
          additionalProperties: true
          type: object
          title: Tags
        certificate:
          anyOf:
          - $ref: '#/components/schemas/CertificateSummary'
          - type: 'null'
      type: object
      required:
      - id
      - hostname
      - os
      - os_version
      - arch
      - agent_version
      - status
      - group_id
      - group_name
      - last_heartbeat_at
      - last_ip
      - clock_skew_ms
      - config_version
      - enrolled_at
      - machine_id
      - tags
      - certificate

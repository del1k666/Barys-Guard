openapi: 3.1.0
info:
  title: BarysGuard DLP Server
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - ops
      summary: Health
      description: Процесс жив. Не проверяет зависимости — для этого /ready.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /ready:
    get:
      tags:
      - ops
      summary: Ready
      description: 'Готовность обслуживать запросы: база доступна.


        Отделено от /health намеренно. Балансировщик снимает трафик по

        /ready, но не перезапускает процесс — перезапуск при недоступной

        базе не помогает и только удлиняет простой.'
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Ready Ready Get
  /gateway/v1/ca:
    get:
      tags:
      - gateway
      summary: Get Ca Certificate
      description: Сертификат удостоверяющего центра. Без аутентификации — он публичен
        по определению.
      operationId: get_ca_certificate_gateway_v1_ca_get
      responses:
        '200':
          description: Successful Response
  /gateway/v1/enroll:
    post:
      tags:
      - gateway
      summary: Enroll
      operationId: enroll_gateway_v1_enroll_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /gateway/v1/whoami:
    get:
      tags:
      - gateway
      summary: Whoami
      description: Проверка аутентификации по клиентскому сертификату.
      operationId: whoami_gateway_v1_whoami_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Whoami Gateway V1 Whoami Get
  /gateway/v1/renew:
    post:
      tags:
      - gateway
      summary: Renew
      operationId: renew_gateway_v1_renew_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /gateway/v1/config:
    get:
      tags:
      - gateway
      summary: Get Agent Config
      operationId: get_agent_config_gateway_v1_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigResponse'
  /gateway/v1/heartbeat:
    post:
      tags:
      - gateway
      summary: Heartbeat
      operationId: heartbeat_gateway_v1_heartbeat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /gateway/v1/commands/{command_id}/result:
    post:
      tags:
      - gateway
      summary: Submit Command Result
      operationId: submit_command_result_gateway_v1_commands__command_id__result_post
      parameters:
      - name: command_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Command Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandResultRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Submit Command Result Gateway V1 Commands  Command
                  Id  Result Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /gateway/v1/events:
    post:
      tags:
      - gateway
      summary: Ingest Events
      description: Пакет событий в NDJSON, одна строка — одно событие. Идемпотентно.
      operationId: ingest_events_gateway_v1_events_post
      requestBody:
        content:
          application/x-ndjson:
            schema:
              $ref: '#/components/schemas/EventEnvelope'
        required: true
      responses:
        '202':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventsResult'
  /gateway/v1/artifacts:
    post:
      tags:
      - gateway
      summary: Open Artifact Upload
      description: 'Открыть загрузку: сервер либо уже имеет артефакт, либо выдаёт
        сессию.'
      operationId: open_artifact_upload_gateway_v1_artifacts_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArtifactOpenRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactOpenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /gateway/v1/artifacts/{upload_id}:
    put:
      tags:
      - gateway
      summary: Upload Artifact Chunk
      description: Очередной чанк. Смещение обязано совпасть с числом уже принятых
        байт.
      operationId: upload_artifact_chunk_gateway_v1_artifacts__upload_id__put
      parameters:
      - name: upload_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Upload Id
      - name: X-Offset
        in: header
        required: true
        schema:
          type: integer
          minimum: 0
          title: X-Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ArtifactChunkResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      requestBody:
        required: true
        content:
          application/octet-stream:
            schema:
              type: string
              format: binary
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login

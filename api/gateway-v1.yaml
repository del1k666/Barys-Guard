openapi: 3.1.0
info:
  title: BarysGuard DLP Server
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - ops
      summary: Health
      description: Процесс жив. Не проверяет зависимости — для этого /ready.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /ready:
    get:
      tags:
      - ops
      summary: Ready
      description: 'Готовность обслуживать запросы: база доступна.


        Отделено от /health намеренно. Балансировщик снимает трафик по

        /ready, но не перезапускает процесс — перезапуск при недоступной

        базе не помогает и только удлиняет простой.'
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Ready Ready Get
  /gateway/v1/ca:
    get:
      tags:
      - gateway
      summary: Get Ca Certificate
      description: Сертификат удостоверяющего центра. Без аутентификации — он публичен
        по определению.
      operationId: get_ca_certificate_gateway_v1_ca_get
      responses:
        '200':
          description: Successful Response
  /gateway/v1/enroll:
    post:
      tags:
      - gateway
      summary: Enroll
      operationId: enroll_gateway_v1_enroll_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /gateway/v1/whoami:
    get:
      tags:
      - gateway
      summary: Whoami
      description: Проверка аутентификации по клиентскому сертификату.
      operationId: whoami_gateway_v1_whoami_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Whoami Gateway V1 Whoami Get
  /gateway/v1/renew:
    post:
      tags:
      - gateway
      summary: Renew
      operationId: renew_gateway_v1_renew_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/enrollment-tokens:
    post:
      tags:
      - api
      summary: Create Token
      operationId: create_token_api_v1_enrollment_tokens_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentTokenRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentTokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents:
    get:
      tags:
      - api
      summary: List Agents
      operationId: list_agents_api_v1_agents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AgentSummary'
                type: array
                title: Response List Agents Api V1 Agents Get
components:
  schemas:
    AgentSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        hostname:
          type: string
          title: Hostname
        os:
          type: string
          title: Os
        agent_version:
          type: string
          title: Agent Version
        status:
          type: string
          title: Status
        last_heartbeat_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Heartbeat At
      type: object
      required:
      - id
      - hostname
      - os
      - agent_version
      - status
      - last_heartbeat_at
      title: AgentSummary
    CreateEnrollmentTokenRequest:
      properties:
        max_uses:
          type: integer
          maximum: 10000.0
          minimum: 1.0
          title: Max Uses
          default: 1
        ttl_hours:
          anyOf:
          - type: integer
            maximum: 8760.0
            minimum: 1.0
          - type: 'null'
          title: Ttl Hours
        group_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Group Id
      type: object
      title: CreateEnrollmentTokenRequest
    EnrollRequest:
      properties:
        token:
          type: string
          maxLength: 64
          title: Token
        csr_pem:
          type: string
          maxLength: 8192
          title: Csr Pem
        host:
          $ref: '#/components/schemas/HostFacts'
      type: object
      required:
      - token
      - csr_pem
      - host
      title: EnrollRequest
    EnrollResponse:
      properties:
        agent_id:
          type: string
          format: uuid
          title: Agent Id
        certificate_pem:
          type: string
          title: Certificate Pem
        ca_pem:
          type: string
          title: Ca Pem
        config_version:
          type: integer
          title: Config Version
        heartbeat_interval_seconds:
          type: integer
          title: Heartbeat Interval Seconds
      type: object
      required:
      - agent_id
      - certificate_pem
      - ca_pem
      - config_version
      - heartbeat_interval_seconds
      title: EnrollResponse
    EnrollmentTokenResponse:
      properties:
        token:
          type: string
          title: Token
        expires_at:
          type: string
          format: date-time
          title: Expires At
        max_uses:
          type: integer
          title: Max Uses
      type: object
      required:
      - token
      - expires_at
      - max_uses
      title: EnrollmentTokenResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HostFacts:
      properties:
        machine_id:
          type: string
          maxLength: 255
          title: Machine Id
        hostname:
          type: string
          maxLength: 255
          title: Hostname
        os:
          type: string
          maxLength: 32
          title: Os
        os_version:
          type: string
          maxLength: 128
          title: Os Version
        arch:
          type: string
          maxLength: 32
          title: Arch
        agent_version:
          type: string
          maxLength: 32
          title: Agent Version
      type: object
      required:
      - machine_id
      - hostname
      - os
      - os_version
      - arch
      - agent_version
      title: HostFacts
    RenewRequest:
      properties:
        csr_pem:
          type: string
          maxLength: 8192
          title: Csr Pem
      type: object
      required:
      - csr_pem
      title: RenewRequest
    RenewResponse:
      properties:
        certificate_pem:
          type: string
          title: Certificate Pem
        ca_pem:
          type: string
          title: Ca Pem
        not_after:
          type: string
          format: date-time
          title: Not After
      type: object
      required:
      - certificate_pem
      - ca_pem
      - not_after
      title: RenewResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError

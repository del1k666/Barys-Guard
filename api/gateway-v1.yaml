openapi: 3.1.0
info:
  title: BarysGuard DLP Server
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - ops
      summary: Health
      description: Процесс жив. Не проверяет зависимости — для этого /ready.
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
  /ready:
    get:
      tags:
      - ops
      summary: Ready
      description: 'Готовность обслуживать запросы: база доступна.


        Отделено от /health намеренно. Балансировщик снимает трафик по

        /ready, но не перезапускает процесс — перезапуск при недоступной

        базе не помогает и только удлиняет простой.'
      operationId: ready_ready_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Ready Ready Get
  /gateway/v1/ca:
    get:
      tags:
      - gateway
      summary: Get Ca Certificate
      description: Сертификат удостоверяющего центра. Без аутентификации — он публичен
        по определению.
      operationId: get_ca_certificate_gateway_v1_ca_get
      responses:
        '200':
          description: Successful Response
  /gateway/v1/enroll:
    post:
      tags:
      - gateway
      summary: Enroll
      operationId: enroll_gateway_v1_enroll_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /gateway/v1/whoami:
    get:
      tags:
      - gateway
      summary: Whoami
      description: Проверка аутентификации по клиентскому сертификату.
      operationId: whoami_gateway_v1_whoami_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Whoami Gateway V1 Whoami Get
  /gateway/v1/renew:
    post:
      tags:
      - gateway
      summary: Renew
      operationId: renew_gateway_v1_renew_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenewRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenewResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /gateway/v1/config:
    get:
      tags:
      - gateway
      summary: Get Agent Config
      operationId: get_agent_config_gateway_v1_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentConfigResponse'
  /gateway/v1/heartbeat:
    post:
      tags:
      - gateway
      summary: Heartbeat
      operationId: heartbeat_gateway_v1_heartbeat_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/HeartbeatRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HeartbeatResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /gateway/v1/commands/{command_id}/result:
    post:
      tags:
      - gateway
      summary: Submit Command Result
      operationId: submit_command_result_gateway_v1_commands__command_id__result_post
      parameters:
      - name: command_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Command Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommandResultRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: object
                additionalProperties:
                  type: string
                title: Response Submit Command Result Gateway V1 Commands  Command
                  Id  Result Post
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/enrollment-tokens:
    post:
      tags:
      - api
      summary: Create Token
      operationId: create_token_api_v1_enrollment_tokens_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateEnrollmentTokenRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentTokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents:
    get:
      tags:
      - api
      summary: List Agents
      operationId: list_agents_api_v1_agents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AgentSummary'
                type: array
                title: Response List Agents Api V1 Agents Get
  /api/v1/config:
    get:
      tags:
      - api
      summary: Read Global Config
      operationId: read_global_config_api_v1_config_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
    put:
      tags:
      - api
      summary: Replace Global Config
      operationId: replace_global_config_api_v1_config_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdateRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/groups/{group_id}/config:
    get:
      tags:
      - api
      summary: Read Group Config
      operationId: read_group_config_api_v1_groups__group_id__config_get
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - api
      summary: Replace Group Config
      operationId: replace_group_config_api_v1_groups__group_id__config_put
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfigUpdateRequest'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfigResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - api
      summary: Delete Group Config
      operationId: delete_group_config_api_v1_groups__group_id__config_delete
      parameters:
      - name: group_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Group Id
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/{agent_id}/config:
    get:
      tags:
      - api
      summary: Read Effective Agent Config
      operationId: read_effective_agent_config_api_v1_agents__agent_id__config_get
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EffectiveConfigResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/{agent_id}/commands:
    post:
      tags:
      - api
      summary: Create Command
      operationId: create_command_api_v1_agents__agent_id__commands_post
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCommandRequest'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommandResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    get:
      tags:
      - api
      summary: List Commands
      operationId: list_commands_api_v1_agents__agent_id__commands_get
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommandResponse'
                title: Response List Commands Api V1 Agents  Agent Id  Commands Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
components:
  schemas:
    AgentConfigDocument:
      properties:
        transport:
          $ref: '#/components/schemas/TransportConfig'
          default:
            heartbeat_interval_seconds: 30
            event_batch_max: 500
            event_batch_max_bytes: 4194304
            backoff_base_seconds: 1
            backoff_max_seconds: 300
        buffer:
          $ref: '#/components/schemas/BufferConfig'
          default:
            max_bytes: 524288000
            max_age_days: 7
        logging:
          $ref: '#/components/schemas/LoggingConfig'
          default:
            level: info
        policies:
          additionalProperties: true
          type: object
          title: Policies
      additionalProperties: false
      type: object
      title: AgentConfigDocument
      description: 'Полная форма конфигурации агента.


        extra="forbid" на каждом уровне обязателен: опечатка вроде

        heartbeat_intervall иначе молча не применится, и разбор такого

        инцидента занимает часы.'
    AgentConfigResponse:
      properties:
        version:
          type: integer
          title: Version
        document:
          additionalProperties: true
          type: object
          title: Document
      type: object
      required:
      - version
      - document
      title: AgentConfigResponse
    AgentSummary:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        hostname:
          type: string
          title: Hostname
        os:
          type: string
          title: Os
        agent_version:
          type: string
          title: Agent Version
        status:
          type: string
          title: Status
        last_heartbeat_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Heartbeat At
      type: object
      required:
      - id
      - hostname
      - os
      - agent_version
      - status
      - last_heartbeat_at
      title: AgentSummary
    BufferConfig:
      properties:
        max_bytes:
          type: integer
          minimum: 1048576.0
          title: Max Bytes
          default: 524288000
        max_age_days:
          type: integer
          maximum: 365.0
          minimum: 1.0
          title: Max Age Days
          default: 7
      additionalProperties: false
      type: object
      title: BufferConfig
    CommandResponse:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        type:
          type: string
          title: Type
        status:
          type: string
          title: Status
        payload:
          additionalProperties: true
          type: object
          title: Payload
        result:
          anyOf:
          - additionalProperties: true
            type: object
          - type: 'null'
          title: Result
        created_at:
          type: string
          format: date-time
          title: Created At
        sent_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Sent At
        completed_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Completed At
        expires_at:
          type: string
          format: date-time
          title: Expires At
      type: object
      required:
      - id
      - type
      - status
      - payload
      - result
      - created_at
      - sent_at
      - completed_at
      - expires_at
      title: CommandResponse
    CommandResultRequest:
      properties:
        status:
          type: string
          enum:
          - done
          - failed
          title: Status
        result:
          additionalProperties: true
          type: object
          title: Result
      type: object
      required:
      - status
      title: CommandResultRequest
    CommandType:
      type: string
      enum:
      - ping
      - refresh_config
      - collect_diagnostics
      title: CommandType
    ConfigResponse:
      properties:
        scope:
          type: string
          title: Scope
        group_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Group Id
        document:
          additionalProperties: true
          type: object
          title: Document
        version:
          type: integer
          title: Version
        updated_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Updated At
      type: object
      required:
      - scope
      - group_id
      - document
      - version
      - updated_at
      title: ConfigResponse
    ConfigUpdateRequest:
      properties:
        document:
          $ref: '#/components/schemas/AgentConfigDocument'
      type: object
      required:
      - document
      title: ConfigUpdateRequest
    CreateCommandRequest:
      properties:
        type:
          $ref: '#/components/schemas/CommandType'
        payload:
          additionalProperties: true
          type: object
          title: Payload
        ttl_seconds:
          type: integer
          maximum: 604800.0
          minimum: 60.0
          title: Ttl Seconds
          default: 3600
      type: object
      required:
      - type
      title: CreateCommandRequest
    CreateEnrollmentTokenRequest:
      properties:
        max_uses:
          type: integer
          maximum: 10000.0
          minimum: 1.0
          title: Max Uses
          default: 1
        ttl_hours:
          anyOf:
          - type: integer
            maximum: 8760.0
            minimum: 1.0
          - type: 'null'
          title: Ttl Hours
        group_id:
          anyOf:
          - type: string
            format: uuid
          - type: 'null'
          title: Group Id
      type: object
      title: CreateEnrollmentTokenRequest
    EffectiveConfigResponse:
      properties:
        agent_id:
          type: string
          format: uuid
          title: Agent Id
        document:
          additionalProperties: true
          type: object
          title: Document
        version:
          type: integer
          title: Version
        applied_version:
          type: integer
          title: Applied Version
      type: object
      required:
      - agent_id
      - document
      - version
      - applied_version
      title: EffectiveConfigResponse
    EnrollRequest:
      properties:
        token:
          type: string
          maxLength: 64
          title: Token
        csr_pem:
          type: string
          maxLength: 8192
          title: Csr Pem
        host:
          $ref: '#/components/schemas/HostFacts'
      type: object
      required:
      - token
      - csr_pem
      - host
      title: EnrollRequest
    EnrollResponse:
      properties:
        agent_id:
          type: string
          format: uuid
          title: Agent Id
        certificate_pem:
          type: string
          title: Certificate Pem
        ca_pem:
          type: string
          title: Ca Pem
        config_version:
          type: integer
          title: Config Version
        heartbeat_interval_seconds:
          type: integer
          title: Heartbeat Interval Seconds
      type: object
      required:
      - agent_id
      - certificate_pem
      - ca_pem
      - config_version
      - heartbeat_interval_seconds
      title: EnrollResponse
    EnrollmentTokenResponse:
      properties:
        token:
          type: string
          title: Token
        expires_at:
          type: string
          format: date-time
          title: Expires At
        max_uses:
          type: integer
          title: Max Uses
      type: object
      required:
      - token
      - expires_at
      - max_uses
      title: EnrollmentTokenResponse
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    HeartbeatRequest:
      properties:
        agent_version:
          type: string
          maxLength: 32
          title: Agent Version
        config_version:
          type: integer
          minimum: 0.0
          title: Config Version
        sent_at:
          type: string
          format: date-time
          title: Sent At
        buffered_events:
          type: integer
          minimum: 0.0
          title: Buffered Events
          default: 0
        buffer_bytes:
          type: integer
          minimum: 0.0
          title: Buffer Bytes
          default: 0
      type: object
      required:
      - agent_version
      - config_version
      - sent_at
      title: HeartbeatRequest
    HeartbeatResponse:
      properties:
        server_time:
          type: string
          format: date-time
          title: Server Time
        config_version:
          type: integer
          title: Config Version
        heartbeat_interval_seconds:
          type: integer
          title: Heartbeat Interval Seconds
        commands:
          items:
            $ref: '#/components/schemas/QueuedCommand'
          type: array
          title: Commands
      type: object
      required:
      - server_time
      - config_version
      - heartbeat_interval_seconds
      - commands
      title: HeartbeatResponse
    HostFacts:
      properties:
        machine_id:
          type: string
          maxLength: 255
          title: Machine Id
        hostname:
          type: string
          maxLength: 255
          title: Hostname
        os:
          type: string
          maxLength: 32
          title: Os
        os_version:
          type: string
          maxLength: 128
          title: Os Version
        arch:
          type: string
          maxLength: 32
          title: Arch
        agent_version:
          type: string
          maxLength: 32
          title: Agent Version
      type: object
      required:
      - machine_id
      - hostname
      - os
      - os_version
      - arch
      - agent_version
      title: HostFacts
    LoggingConfig:
      properties:
        level:
          type: string
          enum:
          - debug
          - info
          - warn
          - error
          title: Level
          default: info
      additionalProperties: false
      type: object
      title: LoggingConfig
    QueuedCommand:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        type:
          type: string
          title: Type
        payload:
          additionalProperties: true
          type: object
          title: Payload
        expires_at:
          type: string
          format: date-time
          title: Expires At
      type: object
      required:
      - id
      - type
      - payload
      - expires_at
      title: QueuedCommand
    RenewRequest:
      properties:
        csr_pem:
          type: string
          maxLength: 8192
          title: Csr Pem
      type: object
      required:
      - csr_pem
      title: RenewRequest
    RenewResponse:
      properties:
        certificate_pem:
          type: string
          title: Certificate Pem
        ca_pem:
          type: string
          title: Ca Pem
        not_after:
          type: string
          format: date-time
          title: Not After
      type: object
      required:
      - certificate_pem
      - ca_pem
      - not_after
      title: RenewResponse
    TransportConfig:
      properties:
        heartbeat_interval_seconds:
          type: integer
          maximum: 3600.0
          minimum: 5.0
          title: Heartbeat Interval Seconds
          default: 30
        event_batch_max:
          type: integer
          maximum: 10000.0
          minimum: 1.0
          title: Event Batch Max
          default: 500
        event_batch_max_bytes:
          type: integer
          maximum: 67108864.0
          minimum: 65536.0
          title: Event Batch Max Bytes
          default: 4194304
        backoff_base_seconds:
          type: integer
          maximum: 60.0
          minimum: 1.0
          title: Backoff Base Seconds
          default: 1
        backoff_max_seconds:
          type: integer
          maximum: 3600.0
          minimum: 1.0
          title: Backoff Max Seconds
          default: 300
      additionalProperties: false
      type: object
      title: TransportConfig
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError

  /api/v1/agents/{agent_id}/revoke:
    post:
      tags:
      - api
      summary: Revoke Agent
      description: 'Отзывает все действующие сертификаты агента и снимает его с обслуживания.


        Отзыв доступен только администратору: это действие мгновенно выводит

        хост из-под наблюдения, и оно же — способ скрыть следы.'
      operationId: revoke_agent_api_v1_agents__agent_id__revoke_post
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RevokeAgentRequest'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'

[project]
name = "barysguard-server"
version = "0.1.0"
description = "BarysGuard DLP server"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "cryptography>=44.0",
    "python-json-logger>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "testcontainers[postgres]>=4.8",
    "ruff>=0.8",
    "mypy>=1.13",
    "pyyaml>=6",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["barysguard*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "S", "ASYNC"]
ignore = ["S101"]

[tool.ruff.lint.isort]
# Каталог alembic/ рядом с кодом сбивает определение: без этого пакет alembic
# считается своим и его импорты уезжают в блок первой стороны.
known-first-party = ["barysguard"]
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
# Ревизии генерируются автоматически: шаблон всегда импортирует op и sa,
# а строки вызовов create_table выходят за 100 символов. Править их руками
# значит расходиться с тем, что выдаёт alembic при следующей автогенерации.
"alembic/versions/*.py" = ["F401", "I001", "E501"]
# Имена исключений домена читаются в коде как условие (raise TokenExpired),
# и суффикс Error к ним ничего не добавляет.
"barysguard/core/errors.py" = ["N818"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

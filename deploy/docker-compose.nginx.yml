# Обратный прокси для локального стенда. Применяется вместе с основным файлом:
#
#   docker compose -f deploy/docker-compose.dev.yml \
#                  -f deploy/docker-compose.nginx.yml up -d
#
# Нужен потому, что личность агента сервер берёт из заголовков X-Client-*,
# которые проставляет nginx после проверки клиентского сертификата. Без него
# проходит только регистрация: она идёт по пути, не требующему сертификата.
#
# Каталог с сертификатами задаётся переменной BG_TLS_DIR. Серверный сертификат
# выпускается внутренним CA стенда и в репозиторий не попадает.
services:
  nginx:
    image: nginx:1.27-alpine
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8443:8443"
    volumes:
      - ../deploy/nginx/barysguard.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - ${BG_TLS_DIR}/server.crt:/etc/barysguard/tls/server.crt:ro
      - ${BG_TLS_DIR}/server.key:/etc/barysguard/tls/server.key:ro
      - ${BG_TLS_DIR}/ca.crt:/var/lib/barysguard/pki/ca.crt:ro
    extra_hosts:
      # Приложение слушает на хосте, а не в контейнере.
      - "host.docker.internal:host-gateway"

# nginx стенда: консоль (http, 8080) и шлюз агентов (mTLS, 8443).
# Основа — deploy/nginx/barysguard.dev.conf; отличия: upstream в сети compose
# и консоль на отдельном порту.

upstream barysguard_server {
    server server:8000;
    keepalive 32;
}

# Агент шлёт heartbeat раз в 30 секунд, события — пакетами: 20 запросов
# в секунду на агента с запасом достаточно.
limit_req_zone $ssl_client_serial zone=agents:10m rate=20r/s;

# --- Консоль ---------------------------------------------------------------
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # КРИТИЧНО ДЛЯ БЕЗОПАСНОСТИ. Личность агента сервер берёт из заголовков
    # X-Client-*. На этом порту клиентских сертификатов нет вовсе, поэтому
    # заголовки снимаются безусловно: иначе браузер (или скрипт) прислал бы
    # X-Client-Verify: SUCCESS и объявил себя любым агентом. Пустое значение
    # в proxy_set_header означает «не передавать заголовок».
    location /api/ {
        include /etc/nginx/conf.d/proxy-headers.conf;
        proxy_set_header X-Client-Verify "";
        proxy_set_header X-Client-Serial "";
        proxy_set_header X-Client-DN     "";
        proxy_pass http://barysguard_server;
    }

    location = /health {
        include /etc/nginx/conf.d/proxy-headers.conf;
        proxy_set_header X-Client-Verify "";
        proxy_set_header X-Client-Serial "";
        proxy_set_header X-Client-DN     "";
        proxy_pass http://barysguard_server/health;
    }

    location = /ready {
        include /etc/nginx/conf.d/proxy-headers.conf;
        proxy_set_header X-Client-Verify "";
        proxy_set_header X-Client-Serial "";
        proxy_set_header X-Client-DN     "";
        proxy_pass http://barysguard_server/ready;
    }

    # Шлюз агентов живёт только на 8443.
    location /gateway/ {
        return 404;
    }

    # Консоль — одностраничное приложение: любой путь без файла отдаёт index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# --- Шлюз агентов ----------------------------------------------------------
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/barysguard/tls/server.crt;
    ssl_certificate_key /etc/barysguard/tls/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    # Клиентские сертификаты проверяются нашим внутренним CA.
    ssl_client_certificate /etc/barysguard/tls/ca.crt;

    # optional, а не on: эндпоинты /enroll и /ca обязаны быть доступны агенту,
    # у которого сертификата ещё нет. Проверку предъявленного сертификата
    # выполняет приложение по заголовку X-Client-Verify.
    ssl_verify_client optional;
    ssl_verify_depth  2;

    client_max_body_size 64m;

    # Агентам нужен только /gateway/. Операторский API на этом порту не
    # выставляется: у агента нет причин в него ходить.
    location /gateway/ {
        limit_req zone=agents burst=40 nodelay;

        include /etc/nginx/conf.d/proxy-headers.conf;

        # КРИТИЧНО ДЛЯ БЕЗОПАСНОСТИ: значения вычисляет nginx. Всё, что клиент
        # прислал под этими именами, здесь безусловно затирается.
        proxy_set_header X-Client-Verify $ssl_client_verify;
        proxy_set_header X-Client-Serial $ssl_client_serial;
        proxy_set_header X-Client-DN     $ssl_client_s_dn;

        proxy_pass http://barysguard_server;
    }

    location / {
        return 404;
    }
}
